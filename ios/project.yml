name: WallPhone
options:
  bundleIdPrefix: cn.local.wallphone
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  RootEncoder:
    url: https://github.com/pedroSG94/RootEncoder-iOS
    exactVersion: "0.1.1"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO
targets:
  WallPhone:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: RootEncoder
        product: RootEncoder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.local.wallphone.app
        PRODUCT_NAME: WallPhone
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.2.5"
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    entitlements:
      path: App/App.entitlements
    scheme:
      testTargets: []
