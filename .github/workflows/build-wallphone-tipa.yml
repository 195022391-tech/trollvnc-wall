name: Build WallPhone tipa

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.0）"
        required: false
        default: "0.1.0"
      create_release:
        description: "上传到 GitHub Release"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "wallphone-v*"

permissions:
  contents: write

jobs:
  tipa:
    name: macOS build WallPhone tipa
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/wallphone-v* ]]; then
            V="${GITHUB_REF_NAME#wallphone-v}"
          else
            V="0.1.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building WallPhone tipa version $V"

      - name: Install tools
        run: |
          brew install xcodegen ldid
          xcodegen --version

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Generate + Build
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -project WallPhone.xcodeproj \
            -scheme WallPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Pack tipa
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DERIVED_DATA: ${{ github.workspace }}/ios/build
        run: |
          chmod +x ios/scripts/pack-tipa.sh
          ios/scripts/pack-tipa.sh "${{ github.workspace }}/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallPhone-${{ steps.ver.outputs.version }}-tipa
          path: dist/*.tipa
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="wallphone-v${VERSION}"
          TIPA="dist/WallPhone-${VERSION}.tipa"
          NOTES="TrollVNC 屏幕墙 — WallPhone tipa（TrollStore）

          - 彩条测试流 H.264 → RTSP :8554/{deviceId}?token=
          - 控制 TCP :19000（hello / heartbeat / set_quality）
          - 墙页须先登记相同 deviceId+token
          - 安装：TrollStore 打开本 tipa

          Artifact from run ${{ github.run_id }}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TIPA" --clobber
          else
            gh release create "$TAG" "$TIPA" --title "WallPhone v${VERSION}" --notes "$NOTES"
          fi
